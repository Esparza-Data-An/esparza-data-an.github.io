# Configuración de Jekyll para el portafolio de Abraham Esparza
theme: jekyll-theme-minimal

# Información del sitio
title: "Abraham Esparza, Data Analytics Portfolio"
description: "Data Analyst • Anthropologist | 'The wise man doesn't give the right answers, poses the right questions'"
url: "https://esparza-data-an.github.io"

# Autor
author:
  name: "Abraham Esparza"
  email: "esparza.abraham.an@gmail.com"

# Redes sociales (personaliza con tus URLs)
social:
  github: "esparzadataan"
  linkedin: "abrahamesparza97"


# Configuración técnica
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclusiones
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - GUIA_CONSTRUCCION.md

# Frontmatter defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
